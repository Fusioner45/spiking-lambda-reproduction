name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  banks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile the C core
        run: gcc -O2 -shared -fPIC -o libsnn_core.so snn_core.c -lm

      - name: Run validation banks
        run: python run_all.py

      - name: Summary
        run: echo "All validation banks passed."
